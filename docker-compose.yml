services:
  reserva-service:
    image: reserva-service
    restart: always
    environment:
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Development"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      CN_CONECTION: "Server=canchas-bd-1aowzx;Port=3306;Database=ReservaCanchas;User=root;Password=Basamea1;AllowPublicKeyRetrieval=True;SslMode=None;ConnectionTimeout=30;"
      TZ: "America/Lima"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # HTTP
      - "traefik.http.routers.api.rule=Host(`canchas-aplication-9ehfnl-7b4c70-38-242-128-50.traefik.me`)"
      - "traefik.http.routers.api.entrypoints=web"

      # HTTPS  🔴 ESTE ES EL QUE TE FALTA
      - "traefik.http.routers.api-secure.rule=Host(`canchas-aplication-9ehfnl-7b4c70-38-242-128-50.traefik.me`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"

      - "traefik.http.services.api.loadbalancer.server.port=80"
    build:
      context: ./
      dockerfile: Dockerfile
    volumes: 
      - reserva-service-log:/Logs
volumes:
    reserva-service-log:
        name: reserva-service-log