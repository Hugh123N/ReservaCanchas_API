services:
  reserva-service:
    image: reserva-service
    restart: always
    environment:
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Production"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConexionString: "${ConexionString}"

      EmailSettings__FromPassword: "${EmailSettings__FromPassword}"

      SecurityOptions__SecurityKey: "${SecurityOptions__SecurityKey}"

      Culqi__PublicKey: "${Culqi__PublicKey}"
      Culqi__SecretKey: "${Culqi__SecretKey}"
      Culqi__WebhookUrl: "${Culqi__WebhookUrl}"

      CloudflareR2__AccountId: "${CloudflareR2__AccountId}"
      CloudflareR2__AccessKeyId: "${CloudflareR2__AccessKeyId}"
      CloudflareR2__SecretAccessKey: "${CloudflareR2__SecretAccessKey}"
      CloudflareR2__PublicUrl: "${CloudflareR2__PublicUrl}"

      OAuth__Google__ClientId: "${OAuth__Google__ClientId}"

      OAuth__Facebook__AppId: "${OAuth__Facebook__AppId}"
      OAuth__Facebook__AppSecret: "${OAuth__Facebook__AppSecret}"
      TZ: "America/Lima"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # HTTP
      - "traefik.http.routers.api.rule=Host(`api.reservafast.com`)"
      - "traefik.http.routers.api.entrypoints=web"

      # HTTPS  🔴 ESTE ES EL QUE TE FALTA
      - "traefik.http.routers.api-secure.rule=Host(`api.reservafast.com`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"

      - "traefik.http.services.api.loadbalancer.server.port=80"
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - reserva-service-log:/Logs
volumes:
  reserva-service-log:
    name: reserva-service-log
