services:
  reserva-service:
    image: reserva-service
    restart: always
    environment:
      ASPNETCORE_URLS: "http://+:80"
      ASPNETCORE_ENVIRONMENT: "Development"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      TZ: "America/Lima"
    expose:
      - "80"
    build:
      context: ./
      dockerfile: Dockerfile
    volumes: 
      - reserva-service-log:/Logs
volumes:
    reserva-service-log:
        name: reserva-service-log